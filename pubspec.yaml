name: green_pay
description: A modern UPI payment app with Apple Pay-like interface.
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  qr_code_scanner: ^1.0.1
  camera: ^0.10.5+9
  path_provider: ^2.1.1
  flutter_svg: ^2.0.9
  animations: ^2.0.11
  uuid: ^4.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.4
  permission_handler: ^11.2.0
  fl_chart: ^0.66.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  http: ^1.1.0
  provider: ^6.1.1
  lottie: ^2.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_animate: ^4.3.0
  flutter_riverpod: ^2.4.9
  contacts_service: 0.6.3
  share_plus: ^7.1.0
  pdf: ^3.10.4


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.7
  mockito: ^5.4.3

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sf/symbols/
    - assets/sf/fonts/

  fonts:
    - family: SF Pro
      fonts:
        - asset: assets/sf/fonts/SF-Pro-Text-Regular.otf
          weight: 400
        - asset: assets/sf/fonts/SF-Pro-Text-RegularItalic.otf
          weight: 400
          style: italic
        - asset: assets/sf/fonts/SF-Pro-Text-Medium.otf
          weight: 500
        - asset: assets/sf/fonts/SF-Pro-Text-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/sf/fonts/SF-Pro-Text-Semibold.otf
          weight: 600
        - asset: assets/sf/fonts/SF-Pro-Text-SemiboldItalic.otf
          weight: 600
          style: italic
        - asset: assets/sf/fonts/SF-Pro-Text-Bold.otf
          weight: 700
        - asset: assets/sf/fonts/SF-Pro-Text-BoldItalic.otf
          weight: 700
          style: italic
    
    - family: SF Pro Display
      fonts:
        - asset: assets/sf/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/sf/fonts/SF-Pro-Display-RegularItalic.otf
          weight: 400
          style: italic
        - asset: assets/sf/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/sf/fonts/SF-Pro-Display-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/sf/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/sf/fonts/SF-Pro-Display-SemiboldItalic.otf
          weight: 600
          style: italic
        - asset: assets/sf/fonts/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: assets/sf/fonts/SF-Pro-Display-BoldItalic.otf
          weight: 700
          style: italic
    
    - family: SF Pro Rounded
      fonts:
        - asset: assets/sf/fonts/SF-Pro-Rounded-Regular.otf
          weight: 400
        - asset: assets/sf/fonts/SF-Pro-Rounded-Medium.otf
          weight: 500
        - asset: assets/sf/fonts/SF-Pro-Rounded-Semibold.otf
          weight: 600
        - asset: assets/sf/fonts/SF-Pro-Rounded-Bold.otf
          weight: 700

    - family: SF Symbols
      fonts:
        - asset: assets/sf/symbols/SF-Symbols.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
